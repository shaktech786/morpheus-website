<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <!-- Left lens -->
  <circle cx="11.8" cy="16" r="4.2" fill="none" stroke="#00ff00" stroke-width="1.2"/>
  <!-- Right lens -->
  <circle cx="20.2" cy="16" r="4.2" fill="none" stroke="#00ff00" stroke-width="1.2"/>
  <!-- Nose bridge -->
  <path d="M16,16 Q16.5,17.2 17,16" fill="none" stroke="#00ff00" stroke-width="0.8"/>
  <!-- M in left lens -->
  <path d="M9,18.5 L9,13.5 L11.8,17 L13,15" fill="none" stroke="#00ff00" stroke-width="0.8" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- M in right lens -->
  <path d="M19,15 L20.2,17 L23,13.5 L23,18.5" fill="none" stroke="#00ff00" stroke-width="0.8" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
